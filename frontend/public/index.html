<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1526" />
    <meta name="description" content="Taurus Trade & Logistics ERP — Enterprise Resource Planning System" />
    <title>Taurus Trade &amp; Logistics ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      html { background: #f4f7fc; }
      [data-theme="dark"] html,
      html[data-theme="dark"] { background: #080e1c; }
      body {
        margin: 0;
        font-family: 'DM Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <script>
      window.API_BASE_URL = '%REACT_APP_API_URL%' !== '%REACT_APP_API_URL%'
        ? '%REACT_APP_API_URL%'
        : window.location.origin + '/api';
      // Restore theme before paint to avoid flash
      (function() {
        var t = localStorage.getItem('erp-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
